name: Weekly Skin Update

on:
  # 每周一 UTC 01:00 = 北京时间周一 09:00
  schedule:
    - cron: '0 1 * * 1'
  # 允许手动触发（在 GitHub 网页 Actions 页面点 Run workflow）
  workflow_dispatch:

# 允许该 workflow 写回仓库
permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawlers
        run: python main.py fetch
        timeout-minutes: 15

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet skins.db data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected."
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skins.db data.json
          git commit -m "chore: weekly auto-update ($(date -u +'%Y-%m-%d'))"
          git push
